name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 6 * * 1'

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: manual

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # A restored build cache lets go build skip compilation, and the
          # tracer then reports "no source code seen".
          cache: false

      - name: Build
        run: |
          go clean -cache
          go build ./...

      - uses: github/codeql-action/analyze@v3
