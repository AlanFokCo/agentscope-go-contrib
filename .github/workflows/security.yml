name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions: read-all

jobs:
  # Fires only on dependency changes in pull requests: new vulnerable or
  # license-incompatible dependencies are blocked before they merge.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          # Keep in sync with the dependency policy in AGENTS.md
          # (Apache-2.0, MIT or BSD only).
          allow-licenses: Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause

  # Reachability-based vulnerability scan of the module graph. Advisory until
  # Go 1.26 becomes the minimum supported version: the fixes for the reachable
  # golang.org/x/net v0.57.0 HTTP/2 findings land in v0.60.0, which requires
  # go1.26, while go.mod supports Go 1.25. The job reports findings without
  # blocking; review the log and do not let new findings accumulate.
  govulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Latest patch of the supported line, so standard-library findings
          # track the toolchain actually built, not an outdated patch.
          go-version: '1.25'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan
        run: govulncheck ./pkg/...
